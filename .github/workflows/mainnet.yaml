name: Hive - Mainnet
# The workflow name alone does not tell dispatched runs apart, so the run
# title names the clients and simulators (and the fixtures tag when pinned).
run-name: >-
  Hive - Mainnet: ${{ join(fromJSON(inputs.client), ', ') }} with
  ${{ join(fromJSON(inputs.simulator), ', ') }}${{ inputs.fixtures_tag && format(' ({0})', inputs.fixtures_tag) || '' }}
on:
  workflow_dispatch:
    inputs:
      fixtures_tag:
        type: string
        default: ""
        description: >-
          Pin a fixtures release tag e.g. tests@v21.0.1 to run that
          release's EELS simulator image. Empty follows `latest`.
      client:
        type: string
        default: '["go-ethereum","reth","nethermind","nimbus-el","besu","erigon","ethrex"]'
        description: JSON array of clients to test .e.g go-ethereum, besu, reth, nethermind, erigon, nimbus-el, ethrex
      client_matrix:
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
        description: If "true", run each client in a separate matrix job. If "false", run all clients together in a single job.
      simulator:
        type: string
        default: >-
          [
            "devp2p",
            "ethereum/consensus",
            "ethereum/eels/consume-engine",
            "ethereum/eels/consume-rlp",
            "ethereum/engine",
            "ethereum/graphql",
            "ethereum/rpc-compat"
          ]
        description: JSON array of simulators to test .e.g ethereum/rpc-compat, ethereum/eels/consume-engine, ethereum/eels/consume-rlp
      hive_version:
        type: string
        default: ethereum/hive@master
        description: GitHub repository and tag for hive (repo@tag)
      client_file:
        type: choice
        default: master.yaml
        description: >-
          Client file under .github/configs/hive/ defining how each client
          is built. The default is the best available source per client
          (prebuilt ethpandaops images where they exist); the -git file
          builds every client from source.
        options:
          - master.yaml
          - master-git.yaml
      client_config:
        type: string
        default: ""
        description: >-
          Inline hive client file (YAML) that replaces the client
          entries of client_file, for example to test a branch or an
          image that is not in the repository configuration. Each EELS
          simulator entry of client_file still applies unless it has an
          entry for that simulator.
      workflow_artifact_upload:
        type: boolean
        default: false
        description: Upload test results as a workflow artifact
      extra_flags:
        type: string
        default: ""
        description: Additional flags to append to the hive command
      concurrency_group:
        type: string
        default: "default"
        description: Concurrency group for the workflow
      timeout_minutes:
        type: string
        default: "2880"
        description: "Timeout in minutes for the test job (default: 2880 = 2 days)"
      client_timeout_overrides:
        type: string
        default: >-
          { "besu": { "ethereum/eels/consume-engine": 4320, "ethereum/eels/consume-rlp": 5760 }, "nethermind": { "ethereum/eels/consume-engine": 2160 } }
        description: >-
          JSON object mapping client name to simulator to a job timeout in
          minutes that takes precedence over timeout_minutes for that
          client and simulator (with tests@v21.0.0, besu needs ~60h for
          eels/consume-engine, more than the 28h the daily triggers allow,
          and ~74h for eels/consume-rlp, more than the 48h its trigger
          allows; nethermind needs ~30h for eels/consume-engine)


env:
  # Proxy
  GOPROXY: "${{ vars.GOPROXY }}"
  # Hive action environment variables
  S3_BUCKET: hive-results
  # Results stay under their old path so the dashboard keeps its history
  S3_PATH: generic
  S3_PUBLIC_URL: https://hive.ethpandaops.io/#/test/mainnet/
  INSTALL_RCLONE_VERSION: v1.68.2
  # rclone reads its flags from RCLONE_* variables, so these reach the
  # action's upload. consume-engine and consume-rlp write one client log per
  # test (32k files on Bogota), which rclone's default 4 transfers upload in
  # about 40 minutes.
  RCLONE_TRANSFERS: "64"
  RCLONE_CHECKERS: "64"
  # Flags used for all simulators
  GLOBAL_EXTRA_FLAGS: >-
    --client.checktimelimit=180s
    --sim.parallelism=4
    --docker.auth
    --docker.buildoutput
  # Flags used for the ethereum/eels/consume-engine simulator
  EELS_ENGINE_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-enginex simulator
  EELS_ENGINEX_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-wirex simulator
  EELS_WIREX_FLAGS: >-
    --sim.loglevel=3
  # Flags used for reth with the ethereum/eels/consume-wirex simulator:
  # deselect test_bad_v_r_s, whose variants stall reth's sync over WireX for
  # the rest of their pre-alloc group. consume reads --sim.limit as a Python
  # regex.
  RETH_WIREX_FLAGS: >-
    --sim.limit='^(?!.*test_bad_v_r_s\[).*'
  # Flags used for the ethereum/eels/consume-sync simulator
  EELS_SYNC_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/eels/consume-rlp simulator
  EELS_RLP_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/eels/execute-blobs simulator
  EELS_EXECUTE_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/rpc-compat simulator
  RPC_COMPAT_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/consensus simulator
  CONSENSUS_FLAGS: >-
    --sim.loglevel=3
  # Flags used for the ethereum/graphql simulator
  GRAPHQL_FLAGS: >-
    --sim.loglevel=3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      # Hive version
      hive_repo: ${{ steps.client_config.outputs.hive_repo }}
      hive_tag: ${{ steps.client_config.outputs.hive_tag }}
      # client_config contains the YAML client config for Hive
      client_config: ${{ steps.client_config.outputs.client_config }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: ".github/scripts/*.py"
      # The EELS simulator image tag goes into the client file's simulator
      # entries, so it is resolved before the file is rendered.
      - name: Resolve fixtures release
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURES_TAG: ${{ inputs.fixtures_tag }}
        run: |
          python3 .github/scripts/resolve_fixtures_release.py \
            --prefix tests
      - name: Render client config
        id: client_config
        env:
          HIVE_VERSION: ${{ inputs.hive_version || 'ethereum/hive@master' }}
          CLIENT_FILE: ${{ inputs.client_file || 'master.yaml' }}
          CLIENT_CONFIG: ${{ inputs.client_config }}
        run: |
          echo "hive_repo=${HIVE_VERSION%@*}" >> "$GITHUB_OUTPUT"
          echo "hive_tag=${HIVE_VERSION#*@}" >> "$GITHUB_OUTPUT"
          uv run --script .github/scripts/render_client_config.py --file "$CLIENT_FILE" \
            --var "EELS_IMAGE_TAG=$EELS_IMAGE_TAG"

  test:
    timeout-minutes: ${{ fromJSON(inputs.client_timeout_overrides)[matrix.client][matrix.simulator] || fromJSON(inputs.timeout_minutes) }}
    needs: prepare
    runs-on: >-
      ${{
        matrix.simulator == 'ethereum/consensus' && 'self-hosted-ghr-size-m-x64' ||
        matrix.simulator == 'ethereum/engine' && 'self-hosted-ghr-size-m-x64' ||
        matrix.simulator == 'ethereum/sync' && 'self-hosted-ghr-size-xl-x64' ||
        contains(matrix.simulator, 'ethereum/eels/') && 'self-hosted-ghr-size-ccx33-x64' ||
        'ubuntu-latest'
      }}
    concurrency:
      group: >-
        ${{ github.head_ref || inputs.concurrency_group }}-${{ matrix.client }}-${{ matrix.simulator }}
    strategy:
      fail-fast: false
      matrix:
        client: >-
          ${{
            inputs.client_matrix == 'true' && fromJSON(inputs.client) ||
            fromJSON(format('["{0}"]', join(fromJSON(inputs.client), '-')))
          }}
        simulator: ${{ fromJSON(inputs.simulator)}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Runners of one size can differ in CPU model, which moves suite wall
      # times by 10-20%. Record the CPU so runs can be compared per host
      # type; the notice can be read back with
      # `gh api repos/<repo>/check-runs/<job id>/annotations`. The logs are
      # public: record only what the host itself reports, not the cloud
      # metadata service (location, addresses, user-data).
      - name: Record runner host
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          memory=$(awk '/^MemTotal:/ { printf "%.1f GiB", $2 / 1048576 }' /proc/meminfo)
          host="cpu=${cpu:-unknown}; cpus=$(nproc); memory=$memory; runner=$RUNNER_NAME"
          echo "::notice title=Runner host::$host"
          echo "Runner host: \`$host\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: ethpandaops/actions/docker-login@a91b7a8dd6a264f5e845ac2aa52d2d6f24e6d01d
        with:
          username: ethpandaops
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: ethpandaops/hive-github-action/helpers/self-hosted-runner-dependencies@09050fc75bae8a10b1876a0826ca4114ea9ed6e8 # v0.6.3
        if: runner.environment != 'github-hosted'

      - uses: ethpandaops/hive-github-action@master # v0.6.x-unreleased
        with:
          hive_repository: ${{ needs.prepare.outputs.hive_repo }}
          hive_version: ${{ needs.prepare.outputs.hive_tag }}
          client: ${{ inputs.client_matrix == 'true' && matrix.client || join(fromJSON(inputs.client), ',') }}
          simulator: ${{ matrix.simulator }}
          client_config: ${{ needs.prepare.outputs.client_config }}
          extra_flags: >-
            ${{ env.GLOBAL_EXTRA_FLAGS }}
            ${{ matrix.simulator == 'ethereum/rpc-compat' && env.RPC_COMPAT_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/consensus' && env.CONSENSUS_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-engine' && env.EELS_ENGINE_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-enginex' && env.EELS_ENGINEX_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-wirex' && env.EELS_WIREX_FLAGS || '' }}
            ${{ matrix.client == 'reth' && matrix.simulator == 'ethereum/eels/consume-wirex' && env.RETH_WIREX_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-sync' && env.EELS_SYNC_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/consume-rlp' && env.EELS_RLP_FLAGS || '' }}
            ${{ matrix.simulator == 'ethereum/eels/execute-blobs' && env.EELS_EXECUTE_FLAGS || '' }}
            ${{ inputs.extra_flags }}
          s3_upload: true
          s3_bucket: ${{ env.S3_BUCKET }}
          s3_path: ${{ env.S3_PATH }}
          s3_public_url: ${{ env.S3_PUBLIC_URL }}
          rclone_config: ${{ secrets.HIVE_RCLONE_CONFIG }}
          rclone_version: ${{ env.INSTALL_RCLONE_VERSION }}
          workflow_artifact_upload: ${{ inputs.workflow_artifact_upload }}
          website_upload: false
          website_index_generation: false
      # Add this job's results to the results index, see generate-index.yaml.
      - name: Update the results index
        if: ${{ !cancelled() && env.RUN_SUCCESS == 'true' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TRIGGER: "${{ github.workflow }}: ${{ matrix.client }} with ${{ matrix.simulator }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'generate-index.yaml',
              ref: process.env.GITHUB_REF_NAME,
              inputs: {
                's3-bucket': process.env.S3_BUCKET,
                's3-path': process.env.S3_PATH,
                trigger: process.env.TRIGGER,
              },
            });
